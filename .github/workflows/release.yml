name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode camera configuration
        env:
          CAMERA_CONFIG_BASE64: ${{ secrets.CAMERA_CONFIG_BASE64 }}
        run: echo "$CAMERA_CONFIG_BASE64" | base64 --decode > camera.properties
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camera-wall.keystore"
      - name: Build signed release APK
        env:
          CAMERA_WALL_KEYSTORE_FILE: ${{ runner.temp }}/camera-wall.keystore
          CAMERA_WALL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAMERA_WALL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAMERA_WALL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease
      - name: Name artifact and generate checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk camera-wall-${GITHUB_REF_NAME}-x86.apk
          sha256sum camera-wall-${GITHUB_REF_NAME}-x86.apk > camera-wall-${GITHUB_REF_NAME}-x86.apk.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            camera-wall-${{ github.ref_name }}-x86.apk
            camera-wall-${{ github.ref_name }}-x86.apk.sha256
